name: "Codex Agent"

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.comment.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent:
    name: Run Codex agent
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    if: >-
      github.repository == 'fedimint/fedimint' &&
      github.actor != 'fedimint-bot' &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.comment.body, '@fedimint-bot') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER'
      )

    steps:
      - name: Acknowledge request
        env:
          GH_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request_review_comment" ]; then
            endpoint="repos/${REPOSITORY}/pulls/comments/${COMMENT_ID}/reactions"
          else
            endpoint="repos/${REPOSITORY}/issues/comments/${COMMENT_ID}/reactions"
          fi

          gh api "${endpoint}" --method POST -f content='eyes'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex in bubblewrap
        env:
          BACKPORT_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
          PPQ_KEY: ${{ secrets.PPQ_KEY }}
          PPQ_MODEL: ${{ vars.PPQ_MODEL || 'openai/gpt-5.5' }}
        run: |
          set -euo pipefail
          nix --extra-experimental-features 'nix-command flakes' \
            --accept-flake-config \
            shell \
            github:numtide/llm-agents.nix#codex \
            nixpkgs#bash \
            nixpkgs#bubblewrap \
            nixpkgs#coreutils \
            nixpkgs#gawk \
            nixpkgs#gh \
            nixpkgs#git \
            nixpkgs#gnused \
            nixpkgs#jq \
            nixpkgs#ripgrep \
            nixpkgs#util-linux \
            -c bash .github/scripts/run-codex-agent-bwrap.sh
